name: Build Android APK (debug)

# Empaquette la PWA dans un APK Android via Capacitor (WebView, hors-ligne).
# Best-effort : non testé en local (pas d'Android Studio). Lancement manuel.
# ⚠️ Le WebView Android n'expose PAS Web Bluetooth : dans l'APK, le bouton
# « +1 » à l'écran, le déclencheur clavier et le GPS marchent ; la Poké Ball /
# télécommande BLE nécessiteraient un plugin natif (chantier ultérieur).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Scaffold Capacitor + build APK debug
        run: |
          set -eux
          # Config injectée pour l'APK : ENV = 'prod' (ou vide → app locale).
          printf "export const SUPABASE_URL = '%s';\nexport const SUPABASE_ANON_KEY = '%s';\nexport const ENV = 'prod';\n" \
            "${{ vars.SUPABASE_URL_PROD }}" "${{ vars.SUPABASE_ANON_KEY_PROD }}" > app/config.js

          npm init -y
          npm install --no-audit --no-fund \
            @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx --no-install cap init "Clean Them All" com.cleanthemall.app --web-dir app
          npx --no-install cap add android
          npx --no-install cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk clean-them-all-debug.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clean-them-all-debug-apk
          path: clean-them-all-debug.apk
          if-no-files-found: error
