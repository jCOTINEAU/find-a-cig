name: Android APK (debug)

# Phase 1 du plan natif : empaquette la PWA dans un APK Android installable
# (Capacitor / WebView, hors-ligne). Ne fait PAS encore le fond écran verrouillé
# (phase 3). Lancement manuel ; artefact = APK debug à télécharger.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Inject Supabase config (dev) + sync into native project
        env:
          URL_DEV: ${{ vars.SUPABASE_URL_DEV }}
          KEY_DEV: ${{ vars.SUPABASE_ANON_KEY_DEV }}
        run: |
          printf "export const SUPABASE_URL = '%s';\nexport const SUPABASE_ANON_KEY = '%s';\nexport const ENV = 'dev';\n" \
            "$URL_DEV" "$KEY_DEV" > app/config.js
          npx --no-install cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk clean-them-all-debug.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clean-them-all-debug-apk
          path: clean-them-all-debug.apk
          if-no-files-found: error
